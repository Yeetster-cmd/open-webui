name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    
    # TRAP 1 FIX: Grant the necessary permissions for creating releases and triggering workflows
    permissions:
      contents: write
      actions: write

    steps:
      # Note: using checkout@v4 as it is highly stable, though v5 works too if preferred
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the last 2 commits so git diff can compare them

      # TRAP 3 FIX: Check if package.json changed in the last commit
      - name: Check for changes in package.json
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "package.json"; then
            echo "package.json changed."
          else
            echo "No changes to package.json, exiting gracefully."
            exit 0 # Change to exit 1 if you want the pipeline to go red/fail
          fi

      # TRAP 2 FIX: Modernized to use $GITHUB_OUTPUT instead of ::set-output
      - name: Get version number from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Extracts the changelog notes for this specific version
      - name: Extract latest CHANGELOG entry
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/release-notes.md

      # Upload your artifacts (Note: This saves them to the GitHub Actions run, not the release itself)
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            .
            !.git

      # Triggers your separate Docker workflow using the updated github-script v7 context syntax
      - name: Trigger Docker build workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yaml',
              ref: 'main', // Usually dispatching triggers on a branch like 'main' where the workflow exists
              inputs: {} 
            })
